<style>
:root{--paper:#FAFAF8;--ink:#1D1D1A;--soft:#5B5B53;--lime:#D8F600;--line:#E2E2DE}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
 padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
header,footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;max-width:1200px;width:100%;margin:0 auto}
.mark{display:flex;align-items:center;gap:12px}
.mark svg{height:34px;width:auto;transform-origin:left center;animation:breathe 4.5s cubic-bezier(.34,1.56,.64,1) infinite}
.mark span{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:75%;font-variation-settings:"wdth" 75;font-weight:700;text-transform:uppercase;font-size:17px;padding-left:12px;border-left:1px solid var(--line)}
@keyframes breathe{0%,70%,100%{transform:none}80%{transform:scaleX(1.3) scaleY(.87)}}
.label{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1200px;width:100%;margin:0 auto;padding-block:48px}
h1{font-family:"Archivo","Arial Narrow",sans-serif;font-stretch:68%;font-variation-settings:"wdth" 68;font-weight:800;text-transform:uppercase;font-size:clamp(52px,11vw,168px);line-height:.88;margin:16px 0 24px;text-wrap:balance}
h1 em{font-style:normal;background:var(--lime);padding:0 .08em}
p{max-width:46ch;font-size:clamp(17px,1.5vw,20px);line-height:1.55;color:var(--soft);margin:0 0 28px}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links a,.copy{font:inherit;font-size:15px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;cursor:pointer}
.copy{background:var(--ink);color:#fff;border-color:var(--ink)}
.links a:hover,.copy:hover{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.dots::after{content:"";animation:dots 1.6s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.mark svg,.dots::after{animation:none}}
</style>
